<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lev &amp; Fit</title>
    <meta name="description" content="Marmitas congeladas saudáveis em Florianópolis e região. Faça seu pedido pelo cardápio." />
    <meta name="theme-color" content="#70a63e" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Lev &amp; Fit" />
    <meta property="og:description" content="Marmitas congeladas saudáveis. Peça pelo cardápio." />
    <meta property="og:image" content="/perfil.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ative o JavaScript para ver o cardápio da Lev &amp; Fit.</noscript>
    <script>
      // Arquivo do site não carregou (página antiga aberta durante uma atualização): recarrega uma vez
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          try {
            if (!sessionStorage.getItem('reloaded-after-update')) { sessionStorage.setItem('reloaded-after-update', '1'); location.reload(); }
          } catch (_) {}
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
